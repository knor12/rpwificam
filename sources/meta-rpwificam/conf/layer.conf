# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*.bb    "

BBFILE_COLLECTIONS += "meta-rpwificam"
BBFILE_PATTERN_meta-rpwificam = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rpwificam = "6"

LAYERDEPENDS_meta-rpwificam = "core"
LAYERSERIES_COMPAT_meta-rpwificam = "scarthgap"
