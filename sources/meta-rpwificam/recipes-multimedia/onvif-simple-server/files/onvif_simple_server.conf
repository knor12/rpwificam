# /etc/onvif_simple_server/onvif_simple_server.conf

[system]
model = Raspberry Pi Camera
manufacturer = RPi Cam System

[device]
# Default port for ONVIF WS-Discovery / Service
port = 10000

[stream]
# Main stream parameters (e.g. RTSP server address)
width = 1920
height = 1080
fps = 30
# Replace with your actual RTSP pipeline/URL output
rtsp_url = rtsp://127.0.0.1:8554/stream0